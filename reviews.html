<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews - Premium AnonClub Service</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #8b5cf6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --gray: #475569;
            --gray-light: #cbd5e1;
            --border: #334155;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: var(--white);
            line-height: 1.6;
            min-height: 100vh;
        }

        /* Loading Screen */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--dark);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s;
        }

        .loader-content {
            text-align: center;
            color: var(--white);
        }

        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--border);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1.5rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Header */
        .header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            padding: 1.5rem 0;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 20px 60px rgba(0,0,0,.8),
                        0 0 80px rgba(99,102,241,.25);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-contact {
            display: flex;
            gap: 1rem;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            border-radius: 50px;
            color: var(--white);
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.9rem;
        }
        .logo-btn {
            text-decoration: none;
        }

        .contact-btn:hover {
            background: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(99,102,241,.4);
        }

        /* Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        /* Stats Section */
        .stats-section {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: center;
            transition: all 0.3s;
            box-shadow: 0 30px 80px rgba(0,0,0,.8), 0 0 120px rgba(99,102,241,.2);
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            box-shadow: 0 20px 60px rgba(99,102,241,.4);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .stat-icon.rating { color: var(--warning); text-shadow: 0 0 20px rgba(245,158,11,.4); }
        .stat-icon.reviews { color: var(--primary); text-shadow: 0 0 20px rgba(99,102,241,.4); }
        .stat-icon.customers { color: var(--success); text-shadow: 0 0 20px rgba(16,185,129,.4); }
        .stat-icon.verified { color: var(--secondary); text-shadow: 0 0 20px rgba(139,92,246,.4); }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 0.5rem;
            line-height: 1.2;
        }

        .stat-label {
            color: var(--gray-light);
            font-size: 0.9rem;
        }

        /* Main Content Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 2rem;
            align-items: start;
        }

        /* Reviews Section */
        .reviews-section {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            box-shadow: 0 30px 80px rgba(0,0,0,.8),
                        0 0 120px rgba(99,102,241,.2);
        }

        .section-title {
            font-size: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: var(--white);
            font-weight: 600;
            line-height: 1.3;
        }

        .section-title i {
            color: var(--primary);
            text-shadow: 0 0 20px rgba(99,102,241,.4);
        }

        /* Review Card */
        .review-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.3s;
            animation: fadeInUp 0.5s;
            box-shadow: 0 20px 60px rgba(0,0,0,.8);
        }

        .review-card:hover {
            transform: translateX(5px);
            border-color: var(--primary);
            box-shadow: 0 30px 80px rgba(99,102,241,.4);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .review-author {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .author-avatar {
            width: 50px;
            height: 50px;
            border-radius: 12px;
            background: radial-gradient(circle at 20% 20%, var(--primary) 0%, #1e1e3a 70%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--white);
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 15px 40px rgba(99,102,241,.5);
        }

        .author-info h4 {
            color: var(--white);
            font-size: 1rem;
            margin-bottom: 0.25rem;
            line-height: 1.3;
            font-weight: 600;
        }

        .review-date {
            color: var(--gray-light);
            font-size: 0.8rem;
            line-height: 1.4;
        }

        .review-rating {
            display: flex;
            gap: 0.25rem;
            font-size: 1.1rem;
            line-height: 1;
        }

        .star {
            color: var(--gray);
        }

        .star.filled {
            color: var(--warning);
            text-shadow: 0 0 20px rgba(245,158,11,.4);
        }

        .review-text {
            color: var(--gray-light);
            line-height: 1.7;
            font-size: .95rem;
            margin-bottom: 1rem;
            white-space: pre-line;
            word-break: break-word;
        }

        .review-footer {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem .75rem;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
        }

        .footer-left {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem .75rem;
            align-items: center;
        }

        .review-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.8rem;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid var(--primary);
            border-radius: 50px;
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1.2;
        }

        .review-badge.verified {
            background: rgba(16, 185, 129, 0.1);
            border-color: var(--success);
            color: var(--success);
        }

        .review-badge.package {
            background: rgba(139,92,246,.12);
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .review-like-btn {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 50px;
            color: var(--gray-light);
            font-size: 0.8rem;
            font-weight: 500;
            line-height: 1;
            padding: .6rem .9rem;
            cursor: pointer;
            transition: .2s;
        }

        .review-like-btn .heart {
            color: #ef4444;
            text-shadow: 0 0 20px rgba(239,68,68,.4);
        }

        .review-like-btn.liked {
            border-color: var(--danger);
            background: rgba(239,68,68,.1);
            color: var(--danger);
            box-shadow: 0 20px 40px rgba(239,68,68,.4);
        }

        /* Submit Review Form */
        .submit-review-section {
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2.5rem;
            position: sticky;
            top: 100px;
            box-shadow: 0 30px 80px rgba(0,0,0,.8),
                        0 0 120px rgba(99,102,241,.3);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--gray-light);
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            transition: all 0.3s;
            font-family: inherit;
        }

        .form-select {
            color: var(--white);
            appearance: none;
            background-image:
                linear-gradient(45deg,transparent 50%,var(--gray) 50%),
                linear-gradient(135deg,var(--gray) 50%,transparent 50%);
            background-position:
                calc(100% - 20px) calc(50% - 3px),
                calc(100% - 15px) calc(50% - 3px);
            background-size:5px 5px,5px 5px;
            background-repeat:no-repeat;
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-input:focus,
        .form-textarea:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        .form-input::placeholder,
        .form-textarea::placeholder {
            color: var(--gray);
        }

        /* Star Rating Selector */
        .star-selector {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .star-btn {
            background: none;
            border: none;
            font-size: 2rem;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.2s;
        }

        .star-btn:hover,
        .star-btn.active {
            color: var(--warning);
            transform: scale(1.15);
            text-shadow: 0 0 20px rgba(245,158,11,.4);
        }

        .rating-label {
            color: var(--gray-light);
            font-size: 0.9rem;
            margin-top: 0.5rem;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            color: var(--white);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 20px 50px rgba(99,102,241,.5);
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 30px 60px rgba(99, 102, 241, 0.6);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Info Box */
        .info-box {
            background: rgba(99, 102, 241, 0.08);
            border: 1px solid var(--primary);
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 20px 60px rgba(99,102,241,.25);
        }

        .info-box p {
            color: var(--gray-light);
            font-size: 0.8rem;
            line-height: 1.6;
        }

        .info-box i {
            color: var(--primary);
            text-shadow: 0 0 20px rgba(99,102,241,.4);
            margin-right: .5rem;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            animation: slideIn 0.3s ease;
            z-index: 10000;
            min-width: 220px;
            max-width: 300px;
            font-size: .9rem;
            line-height: 1.4;
        }

        @keyframes slideIn {
            from { transform: translateY(20px) scale(.95); opacity: 0; }
            to   { transform: translateY(0)    scale(1);    opacity: 1; }
        }

        .toast.success { border-color: var(--success); }
        .toast.error   { border-color: var(--danger); }

        .toast-icon {
            font-size: 1.25rem;
        }

        .toast.success .toast-icon { color: var(--success); }
        .toast.error .toast-icon { color: var(--danger); }

        .toast-message {
            color: var(--white);
            font-weight: 500;
        }

        /* Spinner */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        /* No Reviews */
        .no-reviews {
            text-align: center;
            padding: 3rem;
            color: var(--gray-light);
        }

        .no-reviews-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: var(--gray);
            text-shadow: 0 0 20px rgba(148,163,184,.2);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr;
            }

            .submit-review-section {
                position: relative;
                top: 0;
            }

            .stats-section {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
    .container {
        padding: 2rem 1rem;
    }

    /* 🔥 mobile: form first, then reviews */
    .content-grid {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
    }

    .submit-review-section {
        order: 1;
        padding: 1.5rem;
        /* 👇 center it */
        width: 100%;
        max-width: 520px;
        margin: 0 auto;
    }

    .reviews-section {
        order: 2;
    }

    .stats-section {
        grid-template-columns: 1fr;
    }

    .header-contact {
        display: none;
    }

    .review-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
    }

    .review-footer {
        flex-direction: column;
        align-items: flex-start;
    }
}
    </style>
</head>
<body>
    <!-- Loading Screen -->
    <div class="page-loader" id="pageLoader">
        <div class="loader-content">
            <div class="loader-spinner"></div>
            <h3>Loading Reviews...</h3>
        </div>
    </div>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
           <a href="index.html"  class="logo-btn"  target="_blank"> <div class="logo">
                <i class="fas fa-credit-card"></i>
                <span>AnonClub</span> 
            </div> </a>
            <div class="header-contact">
                <a href="https://t.me/ANONCLUBADMIN" class="contact-btn" target="_blank">
                    <i class="fab fa-telegram"></i>
                    <span>Telegram Support</span>
                </a>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Stats Section -->
        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-icon rating">
                    <i class="fas fa-star"></i>
                </div>
                <div class="stat-value" id="avgRating">0.0</div>
                <div class="stat-label">Average Rating</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon reviews">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <div class="stat-value" id="totalReviews">0</div>
                <div class="stat-label">Total Reviews</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon customers">
                    <i class="fas fa-users"></i>
                </div>
                <div class="stat-value">500+</div>
                <div class="stat-label">Happy Customers</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon verified">
                    <i class="fas fa-shield"></i>
                </div>
                <div class="stat-value">100%</div>
                <div class="stat-label">Verified Reviews</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="content-grid">
            <!-- Reviews List -->
            <div class="reviews-section">
                <h2 class="section-title">
                    <i class="fas fa-comments"></i>
                    Customer Reviews
                </h2>
                <div id="reviewsList">
                    <!-- Reviews will be loaded here -->
                    <div class="no-reviews">
                        <div class="no-reviews-icon">
                            <i class="fas fa-inbox"></i>
                        </div>
                        <h3>No reviews yet</h3>
                        <p>Be the first to leave a review!</p>
                    </div>
                </div>
            </div>

            <!-- Submit Review Form -->
            <div class="submit-review-section">
                <h2 class="section-title">
                    <i class="fas fa-pen"></i>
                    Submit Review
                </h2>

                <div class="info-box">
                    <p>
                        <i class="fas fa-info-circle"></i>
                        Only verified clients can post.
                        
                    </p>
                </div>

                <form id="reviewForm">
                    <!-- Rating -->
                    <div class="form-group">
                        <label class="form-label">Your Rating</label>
                        <div class="star-selector">
                            <button type="button" class="star-btn" data-rating="1"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-rating="2"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-rating="3"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-rating="4"><i class="fas fa-star"></i></button>
                            <button type="button" class="star-btn" data-rating="5"><i class="fas fa-star"></i></button>
                        </div>
                        <div class="rating-label" id="ratingLabel">Tap to rate your experience</div>
                    </div>

                    <!-- Package -->
                    <div class="form-group">
                        <label class="form-label">Which package did you get?</label>
                        <select class="form-select" id="packageSelect" required>
                            <option value="">Select package</option>
                            <option value="Basic">Basic</option>
                            <option value="Standard">Standard</option>
                            <option value="Premium">Premium</option>
                        </select>
                    </div>

                    <!-- Review Text -->
                    <div class="form-group">
                        <label class="form-label">Your Review</label>
                        <textarea 
                            class="form-textarea" 
                            id="reviewText" 
                            placeholder='Example: #(order code) Got the card in 5 days, balance matched, support was fast.'
                            required
                        ></textarea>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <i class="fas fa-paper-plane"></i>
                        <span>Submit Review</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Firebase SDK v10 (Modular) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { 
            getDatabase,
            ref,
            set,
            onValue,
            query,
            orderByChild,
            update
        } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCsYRwAcStGLf6Ygd2h_k3YEsYtFoszjyk",
            authDomain: "skiprinter.firebaseapp.com",
            databaseURL: "https://skiprinter-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "skiprinter",
            storageBucket: "skiprinter.firebasestorage.app",
            messagingSenderId: "218340454975",
            appId: "1:218340454975:web:151394a8dd54001a25fe8a"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        console.log('🔥 Firebase Initialized Successfully');

        // expose a couple helpers if you want to debug in console
        window.firebaseDB = database;
        window.firebaseRef = ref;
        window.firebaseSet = set;
        window.firebaseOnValue = onValue;
        window.firebaseQuery = query;
        window.firebaseOrderByChild = orderByChild;
        window.firebaseUpdate = update;

        /*********************************
         * UI / STATE
         *********************************/

        let selectedRating = 0;

        // remove loading overlay after load
        window.addEventListener('load', function() {
            setTimeout(() => {
                const loader = document.getElementById('pageLoader');
                loader.style.opacity = '0';
                setTimeout(() => loader.remove(), 500);
            }, 500);
        });

        // Toast Notification
        function showToast(message, type = 'success') {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle'
            };

            toast.innerHTML = `
                <div class="toast-icon">
                    <i class="fas ${icons[type]}"></i>
                </div>
                <div class="toast-message">${message}</div>
            `;

            document.body.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px) scale(.98)';
                setTimeout(() => toast.remove(), 250);
            }, 3000);
        }

        /*********************************
         * STAR RATING SELECT
         *********************************/
        const ratingLabelEl = document.getElementById('ratingLabel');
        const starLabels = ['Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];

        document.querySelectorAll('.star-btn').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                selectedRating = parseInt(this.getAttribute('data-rating'));

                document.querySelectorAll('.star-btn').forEach((star, index) => {
                    if (index < selectedRating) {
                        star.classList.add('active');
                    } else {
                        star.classList.remove('active');
                    }
                });

                ratingLabelEl.textContent =
                    `${selectedRating} star${selectedRating > 1 ? 's' : ''} - ${starLabels[selectedRating - 1]}`;
            });
        });

        /*********************************
         * UTILITIES
         *********************************/
        function generateReviewId() {
            const timestamp = Date.now(); // ms
            const random = Math.floor(Math.random() * 1_000_000)
                .toString()
                .padStart(6, '0');
            return `REV-${timestamp}-${random}`;
        }

        function createStarsHTML(ratingNumber) {
            let starsHTML = '';
            for (let i = 1; i <= 5; i++) {
                starsHTML += `<i class="fas fa-star star ${i <= ratingNumber ? 'filled' : ''}"></i>`;
            }
            return starsHTML;
        }

        function escapeHTML(str) {
            if (typeof str !== "string") return str;
            return str
                .replace(/&/g,"&amp;")
                .replace(/</g,"&lt;")
                .replace(/>/g,"&gt;")
                .replace(/"/g,"&quot;");
        }

        // read if this browser already liked a review
        function hasLiked(reviewId) {
            return localStorage.getItem('liked_' + reviewId) === 'true';
        }

        function markLiked(reviewId) {
            localStorage.setItem('liked_' + reviewId, 'true');
        }

        /*********************************
         * RENDER REVIEW CARD
         *********************************/
        function createReviewCard(review) {
            const card = document.createElement('div');
            card.className = 'review-card';

            const authorName = review.isAnonymous ? 'Anonymous' : (review.authorName || 'Customer');
            const authorInitial = authorName.charAt(0).toUpperCase();

            // timestamp -> readable date
          // no timestamp in UI – just show a generic label
// Show only the date in European format (DD/MM/YYYY), no time
const dateObj = new Date(review.timestamp || Date.now());
const dateStr = dateObj.toLocaleDateString('el-GR', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric'
});


            const likesCount = review.likes ? Number(review.likes) : 0;
            const userAlreadyLiked = hasLiked(review.reviewId);

            card.innerHTML = `
                <div class="review-header">
                    <div class="review-author">
                        <div class="author-avatar">${escapeHTML(authorInitial)}</div>
                        <div class="author-info">
                            <h4>${escapeHTML(authorName)}</h4>
                            <div class="review-date">${escapeHTML(dateStr)}</div>
                        </div>
                    </div>
                    <div class="review-rating">
                        ${createStarsHTML(review.rating || 0)}
                    </div>
                </div>

                <p class="review-text">${escapeHTML(review.reviewText || '')}</p>

                <div class="review-footer">
                    <div class="footer-left">
                        ${
                            review.packageType
                            ? `<span class="review-badge package"><i class="fas fa-box-open"></i> ${escapeHTML(review.packageType)} Package</span>`
                            : ''
                        }
                        ${
                            review.isAnonymous
                            ? `<span class="review-badge"><i class="fas fa-user-secret"></i> Anonymous</span>`
                            : ''
                        }
                        <span class="review-badge verified"><i class="fas fa-shield-check"></i> Verified</span>
                    </div>

                    <button
                        class="review-like-btn ${userAlreadyLiked ? 'liked' : ''}"
                        data-review-id="${escapeHTML(review.reviewId)}"
                    >
                        <i class="fas fa-heart heart"></i>
                        <span class="like-num">${likesCount}</span>
                        <span class="like-label">Like</span>
                    </button>
                </div>
            `;

            // attach like logic
            const likeBtn = card.querySelector('.review-like-btn');
            likeBtn.addEventListener('click', async () => {
                const reviewId = likeBtn.getAttribute('data-review-id');
                if (hasLiked(reviewId)) {
                    showToast('You already liked this review', 'error');
                    return;
                }

                // optimistic update
                const likeNumEl = likeBtn.querySelector('.like-num');
                const currentLikes = parseInt(likeNumEl.textContent) || 0;
                const newLikes = currentLikes + 1;
                likeNumEl.textContent = newLikes.toString();
                likeBtn.classList.add('liked');
                markLiked(reviewId);

                // push to Firebase (increment likes)
                try {
                    const likeRef = window.firebaseRef(window.firebaseDB, 'reviews/' + reviewId);
                    await window.firebaseUpdate(likeRef, { likes: newLikes });
                } catch (err) {
                    console.error('Like update error:', err);
                    showToast('Error saving like', 'error');
                }
            });

            return card;
        }

        /*********************************
         * PREPEND REVIEW (instant show)
         *********************************/
        function prependReviewToList(review) {
            const reviewsList = document.getElementById('reviewsList');

            // remove "no reviews" placeholder if there
            const emptyState = reviewsList.querySelector('.no-reviews');
            if (emptyState) emptyState.remove();

            const card = createReviewCard(review);
            reviewsList.insertBefore(card, reviewsList.firstChild);

            // update quick stats
            const totalEl = document.getElementById('totalReviews');
            const avgEl = document.getElementById('avgRating');

            const currentTotal = parseInt(totalEl.textContent || '0', 10);
            const currentAvg = parseFloat(avgEl.textContent || '0') || 0;

            const newTotal = currentTotal + 1;
            const newAvg = ((currentAvg * currentTotal) + (review.rating || 0)) / newTotal;

            totalEl.textContent = newTotal.toString();
            avgEl.textContent = newAvg.toFixed(1);
        }

        /*********************************
         * LOAD REVIEWS (REALTIME)
         *********************************/
        function loadReviews() {
            const reviewsRef = window.firebaseRef(window.firebaseDB, 'reviews');
            const reviewsQuery = window.firebaseQuery(reviewsRef, window.firebaseOrderByChild('timestamp'));

            window.firebaseOnValue(reviewsQuery, (snapshot) => {
                const reviewsList = document.getElementById('reviewsList');
                reviewsList.innerHTML = '';

                const reviews = [];
                snapshot.forEach((childSnapshot) => {
                    reviews.push({
                        id: childSnapshot.key,
                        ...childSnapshot.val()
                    });
                });

                // newest first
                reviews.sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));

                if (reviews.length === 0) {
                    reviewsList.innerHTML = `
                        <div class="no-reviews">
                            <div class="no-reviews-icon">
                                <i class="fas fa-inbox"></i>
                            </div>
                            <h3>No reviews yet</h3>
                            <p>Be the first to leave a review!</p>
                        </div>
                    `;
                    document.getElementById('avgRating').textContent = '0.0';
                    document.getElementById('totalReviews').textContent = '0';
                    return;
                }

                // Update stats
                updateStats(reviews);

                // Render each review card
                reviews.forEach(review => {
                    const reviewCard = createReviewCard(review);
                    reviewsList.appendChild(reviewCard);
                });
            });
        }

        function updateStats(reviews) {
            const total = reviews.length;
            const avgRatingVal = total === 0
                ? 0
                : reviews.reduce((sum, r) => sum + (r.rating || 0), 0) / total;

            document.getElementById('totalReviews').textContent = total.toString();
            document.getElementById('avgRating').textContent = avgRatingVal.toFixed(1);
        }

        /*********************************
         * SUBMIT REVIEW
         *********************************/
        document.getElementById('reviewForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            // rating required
            if (selectedRating === 0) {
                showToast('Please select a rating', 'error');
                return;
            }

            const reviewTextRaw = document.getElementById('reviewText').value.trim();
            if (!reviewTextRaw) {
                showToast('Please write your review', 'error');
                return;
            }

            const packageType = document.getElementById('packageSelect').value;
            if (!packageType) {
                showToast('Please select your package', 'error');
                return;
            }

            // ✅ ENFORCE /anon PREFIX — ONLY these are allowed to post
            const SECRET_PREFIX = "/anon";
            const startsWithAnon = reviewTextRaw.toLowerCase().startsWith(SECRET_PREFIX);

            if (!startsWithAnon) {
                showToast('To post a review, start with "#(ordercode)"', 'error');
                return; // ❌ decline everything that does not start with /anon
            }

            // strip the prefix and validate there is actual text after it
            const cleanedReviewText = reviewTextRaw.substring(SECRET_PREFIX.length).trim();
            if (!cleanedReviewText) {
                showToast('Please describe your experience after "/anon".', 'error');
                return;
            }

            const isAnonymous = true; // ✅ always true when passing the check

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="spinner"></div><span>Submitting...</span>';

            try {
                const reviewId = generateReviewId();

                const reviewData = {
                    reviewId: reviewId,
                    rating: selectedRating,
                    reviewText: cleanedReviewText,       // stored without the /anon prefix
                    isAnonymous: isAnonymous,            // ✅ must be true
                    packageType: packageType,
                    authorName: 'Anonymous',             // ✅ enforce anonymous author
                    likes: 0,
                    timestamp: Date.now(),
                    createdAt: new Date().toISOString(),
                    createdAtReadable: new Date().toLocaleString(),
                    status: 'published'
                };

                // Save review to Firebase
                const reviewRef = window.firebaseRef(window.firebaseDB, 'reviews/' + reviewId);
                await window.firebaseSet(reviewRef, reviewData);

                // ✅ show instantly
                prependReviewToList(reviewData);

                showToast('Review submitted successfully!', 'success');

                // Reset form UI
                document.getElementById('reviewForm').reset();
                selectedRating = 0;
                document.querySelectorAll('.star-btn').forEach(star => star.classList.remove('active'));
                ratingLabelEl.textContent = 'Tap to rate your experience';

            } catch (error) {
                console.error('❌ Firebase Error:', error);
                showToast('Error: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i><span>Submit Review</span>';
            }
        });

        /*********************************
         * INIT
         *********************************/
        window.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Reviews System Initialized');
            loadReviews();
        });

        // Auto-resize textarea
        const textarea = document.getElementById('reviewText');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });
    </script>
</body>
</html>
